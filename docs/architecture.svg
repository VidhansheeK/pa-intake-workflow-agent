<svg viewBox="0 0 1600 780" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;max-height:100%;" font-family="Segoe UI,system-ui,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>

<!-- INTAKE -->
<text x="30" y="34" font-size="19" font-weight="700" fill="#4b7bec" letter-spacing="2">INTAKE</text>
<rect x="30" y="52" width="230" height="74" rx="10" fill="#eef4ff" stroke="#4b7bec" stroke-width="2"/>
<text x="145" y="83" text-anchor="middle" font-size="24" font-weight="600" fill="#12325c">Fax (.txt)</text>
<text x="145" y="108" text-anchor="middle" font-size="19" fill="#4a6fa5">unstructured</text>
<rect x="30" y="140" width="230" height="74" rx="10" fill="#eef4ff" stroke="#4b7bec" stroke-width="2"/>
<text x="145" y="171" text-anchor="middle" font-size="24" font-weight="600" fill="#12325c">Portal packet</text>
<text x="145" y="196" text-anchor="middle" font-size="19" fill="#4a6fa5">structured JSON</text>
<rect x="30" y="228" width="230" height="74" rx="10" fill="#eef4ff" stroke="#4b7bec" stroke-width="2"/>
<text x="145" y="259" text-anchor="middle" font-size="24" font-weight="600" fill="#12325c">Watched folder</text>
<text x="145" y="284" text-anchor="middle" font-size="19" fill="#4a6fa5">event-driven</text>

<!-- EXTRACTION -->
<line x1="260" y1="89" x2="318" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="260" y1="265" x2="318" y2="215" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="322" y="126" width="212" height="114" rx="10" fill="#fdf4e5" stroke="#b45309" stroke-width="2.5"/>
<text x="428" y="163" text-anchor="middle" font-size="25" font-weight="700" fill="#7c3f06">Extraction</text>
<text x="428" y="192" text-anchor="middle" font-size="19" fill="#8a5a20">fax to fields</text>
<text x="428" y="217" text-anchor="middle" font-size="19" fill="#8a5a20">AI · regex fallback</text>
<line x1="260" y1="177" x2="318" y2="180" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="534" y1="183" x2="590" y2="183" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>

<!-- PIPELINE -->
<rect x="586" y="20" width="574" height="330" rx="14" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 5"/>
<text x="600" y="12" font-size="17" font-weight="700" fill="#64748b" letter-spacing="1.4">THE PIPELINE — proposes, never decides</text>
<rect x="606" y="40" width="252" height="86" rx="9" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="732" y="70" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">1 · Completeness</text>
<text x="732" y="95" text-anchor="middle" font-size="18" fill="#64748b">rules + AI reads notes</text>
<rect x="888" y="40" width="252" height="86" rx="9" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="1014" y="70" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">2 · Duplicates</text>
<text x="1014" y="95" text-anchor="middle" font-size="18" fill="#64748b">same member + code</text>
<rect x="606" y="244" width="252" height="86" rx="9" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="732" y="274" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">3 · Follow-up letter</text>
<text x="732" y="299" text-anchor="middle" font-size="18" fill="#64748b">AI draft + code rubric</text>
<rect x="888" y="244" width="252" height="86" rx="9" fill="#fff" stroke="#475569" stroke-width="2"/>
<text x="1014" y="274" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">4 · Routing</text>
<text x="1014" y="299" text-anchor="middle" font-size="18" fill="#64748b">6 queues · no AI</text>
<line x1="858" y1="83" x2="884" y2="83" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
<polyline points="1014,126 1014,185 732,185 732,240" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="858" y1="287" x2="884" y2="287" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>

<!-- HUMAN GATE -->
<line x1="1140" y1="287" x2="1196" y2="230" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1200" y="122" width="370" height="152" rx="12" fill="#e7f6ec" stroke="#1a7f4b" stroke-width="4"/>
<text x="1385" y="164" text-anchor="middle" font-size="27" font-weight="700" fill="#0f5132">HUMAN APPROVAL</text>
<text x="1385" y="200" text-anchor="middle" font-size="21" fill="#166534">approve · edit · reject</text>
<text x="1385" y="238" text-anchor="middle" font-size="19" font-style="italic" fill="#1a7f4b">the only path to any action</text>

<!-- AUDIT -->
<line x1="1385" y1="274" x2="1385" y2="330" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="1200" y="336" width="370" height="92" rx="10" fill="#f6f8fb" stroke="#64748b" stroke-width="2"/>
<text x="1385" y="372" text-anchor="middle" font-size="23" font-weight="700" fill="#334155">Audit log</text>
<text x="1385" y="402" text-anchor="middle" font-size="19" fill="#64748b">append-only · who, what, when</text>
<polyline points="1014,330 1014,392 1196,392" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="1030" y="382" font-size="17" fill="#64748b">every proposal</text>

<!-- COST GUARD -->
<rect x="586" y="470" width="574" height="92" rx="10" fill="#fdf4e5" stroke="#b45309" stroke-width="2.5"/>
<text x="873" y="506" text-anchor="middle" font-size="23" font-weight="700" fill="#7c3f06">Cost guard</text>
<text x="873" y="536" text-anchor="middle" font-size="19" fill="#8a5a20">meters every AI call · hard budget · loop breaker</text>
<line x1="873" y1="466" x2="873" y2="356" stroke="#b45309" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<text x="885" y="420" font-size="17" fill="#b45309">caps AI spend</text>
</svg>