<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PA Intake Agent — Architecture</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1f2937; --muted: #64748b;
    --line: #475569; --box: #94a3b8;
    --green: #1a7f4b; --green-bg: #e7f6ec;
    --amber: #b45309; --amber-bg: #fdf4e5;
    --blue: #1d4ed8; --blue-bg: #edf3fd;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 40px 24px 56px;
  }
  .wrap { max-width: 1060px; margin: 0 auto; }
  h1 { font-size: 26px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 4px 0 20px; font-size: 14.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .chip {
    background: var(--card); border: 1px solid #e2e8f0; border-radius: 999px;
    padding: 6px 14px; font-size: 13px; color: var(--muted);
    box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
  }
  .chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
  figure {
    background: var(--card); border: 1px solid #e2e8f0; border-radius: 14px;
    padding: 26px 22px 14px; box-shadow: 0 1px 3px rgb(15 23 42 / 0.06);
    overflow-x: auto;
  }
  svg { display: block; width: 100%; max-width: 1000px; height: auto; margin: 0 auto; }
  figcaption { color: var(--muted); font-size: 13.5px; padding: 14px 6px 4px; max-width: 900px; margin: 0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Prior Authorization Intake Workflow Agent</h1>
  <p class="sub">FDE Cohort 5 Capstone · Track 2 — architecture. Synthetic data only, no PHI.</p>

  <div class="chips">
    <span class="chip"><b>100%</b> missing-info detection F1</span>
    <span class="chip"><b>26/26</b> routing accuracy</span>
    <span class="chip"><b>15/15</b> letter rubric pass</span>
    <span class="chip"><b>38/38</b> LLM calls verified served</span>
    <span class="chip"><b>17/17</b> tests</span>
    <span class="chip"><b>0</b> API keys required to run</span>
  </div>

  <figure>
  <svg viewBox="0 0 1000 560" role="img"
       aria-label="Architecture: synthetic packets flow through completeness check, follow-up drafting, and rule-based routing to a human approval gate; an LLM layer with offline fallback serves two steps; every decision lands in an append-only audit log; an eval harness replays all cases against golden labels.">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
      </marker>
    </defs>

    <!-- ===== inputs ===== -->
    <text x="22" y="62" font-size="10.5" fill="#64748b" letter-spacing="1.4" font-weight="600">SYNTHETIC INPUTS</text>
    <rect x="20" y="72" width="135" height="30" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="87" y="91" font-size="12" fill="#1f2937" text-anchor="middle">26 intake packets</text>
    <rect x="20" y="110" width="135" height="30" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="87" y="129" font-size="12" fill="#1f2937" text-anchor="middle">CPT policy catalog</text>
    <rect x="20" y="148" width="135" height="30" rx="6" fill="#fff" stroke="#94a3b8"/>
    <text x="87" y="167" font-size="12" fill="#1f2937" text-anchor="middle">eligibility snapshot</text>
    <line x1="155" y1="87"  x2="168" y2="87"  stroke="#475569"/>
    <line x1="155" y1="125" x2="168" y2="125" stroke="#475569"/>
    <line x1="155" y1="163" x2="168" y2="163" stroke="#475569"/>
    <line x1="168" y1="87"  x2="168" y2="163" stroke="#475569"/>
    <line x1="168" y1="125" x2="200" y2="125" stroke="#475569" marker-end="url(#a)"/>

    <!-- ===== pipeline group ===== -->
    <rect x="205" y="46" width="580" height="146" rx="10" fill="none" stroke="#cbd5e1" stroke-dasharray="5 4"/>
    <text x="215" y="40" font-size="10.5" fill="#64748b" letter-spacing="1.4" font-weight="600">PIPELINE — PROPOSES, NEVER FINALIZES</text>

    <rect x="218" y="76" width="168" height="100" rx="8" fill="#fff" stroke="#475569" stroke-width="1.3"/>
    <text x="302" y="98" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">1 · COMPLETENESS</text>
    <text x="302" y="118" font-size="11" fill="#64748b" text-anchor="middle">rules: fields · NPI Luhn</text>
    <text x="302" y="133" font-size="11" fill="#64748b" text-anchor="middle">ICD-10 · eligibility</text>
    <text x="302" y="156" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">LLM: notes vs policy</text>

    <line x1="386" y1="126" x2="424" y2="126" stroke="#475569" marker-end="url(#a)"/>
    <text x="405" y="117" font-size="10.5" fill="#64748b" text-anchor="middle">findings</text>

    <rect x="428" y="76" width="168" height="100" rx="8" fill="#fff" stroke="#475569" stroke-width="1.3"/>
    <text x="512" y="98" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">2 · FOLLOW-UPS</text>
    <text x="512" y="118" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">LLM letter → code rubric</text>
    <text x="512" y="133" font-size="11" fill="#64748b" text-anchor="middle">→ retry ×1 → template</text>
    <text x="512" y="156" font-size="11" fill="#64748b" text-anchor="middle">(incomplete cases only)</text>

    <line x1="596" y1="126" x2="634" y2="126" stroke="#475569" marker-end="url(#a)"/>

    <rect x="638" y="76" width="132" height="100" rx="8" fill="#fff" stroke="#475569" stroke-width="1.3"/>
    <text x="704" y="98" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">3 · ROUTING</text>
    <text x="704" y="118" font-size="11" fill="#64748b" text-anchor="middle">decision table</text>
    <text x="704" y="133" font-size="11" fill="#64748b" text-anchor="middle">5 queues</text>
    <text x="704" y="156" font-size="11" font-weight="600" fill="#1f2937" text-anchor="middle">no LLM · auditable</text>

    <line x1="785" y1="126" x2="822" y2="126" stroke="#475569" marker-end="url(#a)"/>
    <text x="803" y="117" font-size="10.5" fill="#64748b" text-anchor="middle">proposal</text>

    <!-- ===== human gate ===== -->
    <rect x="826" y="76" width="156" height="100" rx="8" fill="#e7f6ec" stroke="#1a7f4b" stroke-width="2"/>
    <text x="904" y="98" font-size="12.5" font-weight="700" fill="#1a7f4b" text-anchor="middle">4 · HUMAN GATE</text>
    <text x="904" y="120" font-size="11" fill="#1f2937" text-anchor="middle">approve · edit · reject</text>
    <text x="904" y="135" font-size="11" fill="#64748b" text-anchor="middle">Streamlit review queue</text>
    <text x="904" y="150" font-size="11" fill="#64748b" text-anchor="middle">or CLI --approve</text>
    <text x="904" y="168" font-size="10.5" font-weight="600" fill="#1a7f4b" text-anchor="middle">sole path to external effect</text>

    <!-- gate -> audit -->
    <line x1="904" y1="176" x2="904" y2="248" stroke="#475569" marker-end="url(#a)"/>
    <text x="911" y="216" font-size="10.5" fill="#64748b">decision</text>

    <!-- pipeline -> audit (dashed) -->
    <polyline points="704,176 704,286 818,286" fill="none" stroke="#475569" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <text x="712" y="234" font-size="10.5" fill="#64748b">every proposal</text>

    <rect x="822" y="252" width="164" height="70" rx="8" fill="#fff" stroke="#475569" stroke-width="1.3"/>
    <text x="904" y="274" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">audit_log.jsonl</text>
    <text x="904" y="292" font-size="11" fill="#64748b" text-anchor="middle">append-only · who/what/when</text>
    <text x="904" y="307" font-size="11" fill="#64748b" text-anchor="middle">reviewer edits = future signal</text>

    <!-- ===== LLM layer ===== -->
    <line x1="302" y1="176" x2="302" y2="254" stroke="#b45309" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <text x="309" y="222" font-size="10.5" fill="#b45309">notes judgment</text>
    <line x1="512" y1="176" x2="512" y2="254" stroke="#b45309" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <text x="519" y="222" font-size="10.5" fill="#b45309">letter draft</text>

    <rect x="218" y="258" width="380" height="118" rx="10" fill="#fdf4e5" stroke="#b45309" stroke-width="1.5"/>
    <text x="232" y="280" font-size="11" font-weight="700" fill="#b45309" letter-spacing="0.8">LLM LAYER — src/llm.py</text>
    <rect x="232" y="292" width="100" height="30" rx="6" fill="#fff" stroke="#b45309"/>
    <text x="282" y="311" font-size="11" fill="#1f2937" text-anchor="middle">Claude · paid</text>
    <line x1="332" y1="307" x2="352" y2="307" stroke="#475569" marker-end="url(#a)"/>
    <rect x="356" y="292" width="104" height="30" rx="6" fill="#fff" stroke="#b45309"/>
    <text x="408" y="311" font-size="11" fill="#1f2937" text-anchor="middle">Gemini · free</text>
    <line x1="460" y1="307" x2="480" y2="307" stroke="#475569" marker-end="url(#a)"/>
    <rect x="484" y="292" width="100" height="30" rx="6" fill="#fff" stroke="#b45309"/>
    <text x="534" y="311" font-size="11" fill="#1f2937" text-anchor="middle">offline rules</text>
    <text x="408" y="343" font-size="10.5" fill="#64748b" text-anchor="middle">falls right on missing key · API error · safety refusal — never blocks</text>
    <text x="408" y="360" font-size="10.5" fill="#64748b" text-anchor="middle">structured JSON output · 429 retry-wait · call-integrity counters</text>

    <!-- ===== quality harness ===== -->
    <rect x="20" y="416" width="962" height="120" rx="10" fill="#edf3fd" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="36" y="440" font-size="11" font-weight="700" fill="#1d4ed8" letter-spacing="0.8">QUALITY HARNESS — REPLAYS ALL 26 PACKETS THROUGH THE REAL PIPELINE</text>

    <rect x="36" y="456" width="230" height="58" rx="8" fill="#fff" stroke="#1d4ed8"/>
    <text x="151" y="478" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">golden_labels.json</text>
    <text x="151" y="496" font-size="11" fill="#64748b" text-anchor="middle">ground truth, by construction</text>

    <line x1="266" y1="485" x2="306" y2="485" stroke="#475569" marker-end="url(#a)"/>
    <text x="286" y="476" font-size="10.5" fill="#64748b" text-anchor="middle">evals-only</text>

    <rect x="310" y="456" width="330" height="58" rx="8" fill="#fff" stroke="#1d4ed8"/>
    <text x="475" y="478" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">evals/run_evals.py</text>
    <text x="475" y="496" font-size="11" fill="#64748b" text-anchor="middle">precision / recall / F1 · routing · letter rubric · LLM call integrity</text>

    <rect x="672" y="456" width="140" height="58" rx="8" fill="#fff" stroke="#1d4ed8"/>
    <text x="742" y="478" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">pytest suite</text>
    <text x="742" y="496" font-size="11" fill="#64748b" text-anchor="middle">17 tests</text>

    <rect x="844" y="456" width="122" height="58" rx="8" fill="#fff" stroke="#1d4ed8"/>
    <text x="905" y="478" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">results.json</text>
    <text x="905" y="496" font-size="11" fill="#64748b" text-anchor="middle">regression gate</text>
  </svg>
  <figcaption>
    The pipeline only ever <em>proposes</em> — the human gate (green) is the sole path to external
    effect, and every proposal and decision lands in the append-only audit log. The LLM layer (amber)
    serves exactly two language tasks and degrades left-to-right to a fully offline deterministic mode,
    so the workflow never blocks on a model. Golden labels (blue) are readable only by the eval
    harness, so the pipeline cannot see its own answer key.
  </figcaption>
  </figure>
</div>
</body>
</html>
